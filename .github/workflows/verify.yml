name: Verify
# Verify runs where it can still change the outcome: pull requests and tag
# releases. A plain push to main no longer starts it, because release.yml runs
# the same checks for a tag and a red main is caught before the tag is cut.
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    name: Types and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run preflight
      - name: Type check
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log
      - name: Pure logic and server contracts
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-diagnostics
          path: |
            check.log
            unit.log

  e2e:
    name: Browser regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run preflight
      - run: npx playwright install --with-deps chromium
      - name: Isolated demo instance
        run: |
          set -o pipefail
          npm run test:web 2>&1 | tee e2e.log
      - name: Report verification failure
        if: failure()
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync } from 'node:fs';
          if (existsSync('e2e.log')) {
            const log = readFileSync('e2e.log', 'utf8').slice(-3500);
            console.log('::error title=Verification diagnostics::' + log.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A'));
          }
          JS
      - name: Upload browser traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            e2e.log
            artifacts/playwright/

  pwa:
    name: PWA install check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run preflight
      - run: npx playwright install --with-deps chromium webkit
      - name: Installable shell
        run: |
          set -o pipefail
          npm run test:pwa 2>&1 | tee pwa.log
      - name: Upload PWA diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-artifacts
          path: |
            pwa.log
            artifacts/pwa/

  package:
    name: Package smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run preflight
      - name: Pack and boot
        run: |
          set -o pipefail
          npm run test:package 2>&1 | tee package.log
      - name: Upload package diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-diagnostics
          path: package.log
